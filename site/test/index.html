<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testes — App Perícia</title>
  <link rel="stylesheet" href="../css/pericia.css" />
  <style>
    body { padding: 1rem; }
    #results { margin-top: 1rem; }
    .passed { color: green; margin: 0.25rem 0; }
    .failed { color: red; margin: 0.25rem 0; }
    pre { background: #f5f5f5; padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>Testes de comportamento — App Perícia</h1>
    <p>Abra este arquivo em um servidor local ou ambiente browser-friendly para validar as regras de cadeia e autenticação.</p>
  </header>
  <main>
    <div id="results"></div>
  </main>
  <script src="../js/chain.js"></script>
  <script src="../js/auth.js"></script>
  <script src="assert.js"></script>
  <script src="chain.test.js"></script>
  <script src="auth.test.js"></script>
  <script>
    runTests().catch(function (err) {
      var pre = document.createElement('pre');
      pre.textContent = err && err.stack ? err.stack : String(err);
      document.body.appendChild(pre);
    });
  </script>
</body>
</html>
